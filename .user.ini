; ===================================================================
; MwalimuLink PHP Configuration & Security Hardening
; Defensive mitigation against PHP2Shell (CVE-2026-109618 / CVE-2026-109619)
; ===================================================================

; Disable session upload progress tracking (primary trigger for multipart OOM bug)
session.upload_progress.enabled = 0
session.upload_progress.cleanup = 1

; Ensure memory allocation comfortably exceeds maximum POST payload size
memory_limit = 256M
post_max_size = 32M
upload_max_filesize = 20M

; Execution and input limits
max_execution_time = 60
max_input_time = 60
